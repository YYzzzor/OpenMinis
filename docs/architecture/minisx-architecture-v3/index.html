:null,"kind":"源码"},{"path":"src/ios/NativeOffloads/ClipboardOffload.m","symbol":"命令入口 / 子命令处理；核查深度见本项","lines":null,"kind":"源码"},{"path":"src/ios/NativeOffloads/OpenOffload.m","symbol":"命令入口 / 子命令处理；核查深度见本项","lines":null,"kind":"源码"},{"path":"docs/specs/ios-device-data-capabilities.md","symbol":"第 2–6 节：接口与边界","lines":null,"kind":"项目文档"}],"verification":"框架与功能对应表；具体实现核查深度见对应能力项。"}],"moduleGuides":{"ish":{"intro":"以“查看今天的日历事件”为例，模型选择 shell_execute，并给出 apple-calendar list --today --compact。下面只追踪该命令的执行路径，示例未在设备上运行。","steps":[["接收命令与检查","executeSingleToolUse() 接收工具名和参数，进行参数预检；shell 路径按可识别命令执行应用内权限检查。通过后调用 executeCommand()。","工具参数 → 命令字符串和超时预算"],["准备会话执行上下文","executeCommand() 取得 sessionId，检查 Bash 兼容性，并经 runRaw() 进入协调器。execute() 检查 isBooted，登记执行并准备静态挂载，再取得 MinisFsRouter 的 fsContext。","sessionId → 文件路由标记 fsContext"],["启动独立 shell","runCommand() 读取 EnvVarStore 的环境变量，把命令写入 stdin 脚本，交给 ISHShellExecutor.executeExecutable(\"/bin/sh\", …)。每次命令拥有自己的 PID（进程编号）和管道（输入输出通道）。","脚本 + 环境变量 + fsContext → 客体进程"],["按命令类型执行","普通 Linux 命令沿客体程序路径运行；已注册的 apple-calendar 进入对应原生处理器。该示例随后使用 EventKit 读取事件。","已注册命令 → 原生能力桥接"],["边执行边返回输出","lineCallback 把文本行交给上层供工具块更新；PID 回调用于跟踪运行状态。完成回调汇总 stdout 与 stderr，再返回 output 和 exitCode。","增量输出 → 界面；完成结果 → 等待中的调用方"],["清理输出并继续 Agent 循环","runRaw() 处理回车覆盖和终端控制符，并对超长结果保留首尾。工具层生成与原调用 ID 配对的 toolResult，主循环保存结果并让模型继续。","CommandResult → toolResult → 后续模型请求"]],"details":[["会话路径为什么需要路由","两个会话都可使用 /var/minis/workspace/result.txt。MinisFsRouter 按 fsContext 将其映射到各自的 Library/MinisChat/minis/\u003csessionId>/workspace/result.txt；attachments、offloads、browser 同样按会话路由。memory、skills、shared 等保持共享挂载。"],["工作目录与文件保存","包装脚本从 cd /root 开始，每次执行使用独立 shell。命令内部的 cd 和临时环境改变属于当前进程；需要跨命令保留的内容应写入明确的会话工作目录。"],["等待、超时与停止","协调器用 continuation 记录等待位置，让完成回调恢复 async 函数。未传 timeout 时协调器用 300 秒兜底；聊天入口通常传入自己的预算。超时/停止路径请求结束进程组，随后返回结果或错误。已经提交到系统的写入副作用应另行核对。"],["读旧文档时如何取舍","旧概述与少量遗留注释仍描述串行队列。当前 execute() 直接登记后运行独立命令，支持同会话与跨会话并发；perSessionInflight 用于跟踪执行和停止。"]],"refs":[{"path":"src/ios/Agent/Chat/AIChatViewModel+ConcurrentTools.swift","symbol":"shell_execute 权限检查、executeCommand 回调与结果处理","lines":[217,388],"kind":"源码"},{"path":"src/ios/Agent/ISH/ISHExecutionCoordinator.swift","symbol":"execute(); runCommand(); stopCurrentCommand(sessionId:)","lines":null,"kind":"源码"},{"path":"src/ios/Agent/Chat/AIChatViewModel+ISHCommand.swift","symbol":"executeCommand(); runRaw()","lines":[17,181],"kind":"源码"},{"path":"src/ios/Agent/ISH/MinisFsRouter.swift","symbol":"context(for:); installHook(); hostPath(forGuest:sid:)","lines":null,"kind":"源码"}]},"native":{"intro":"同一个日历查询在这里从命令参数变成 EventKit 查询。原生处理器运行在 App 本地，负责参数、权限、结果格式和错误转换。","steps":[["启动时登记命令","ISHKernel.bootWithRootPath: 调用各组注册函数。calendar_offload_register() 用 native_offload_add_handler(\"apple-calendar\", calendar_handler) 绑定入口，并准备客体命令 stub，即 shell 可以找到的占位命令文件。","命令名 → 可调用处理器函数"],["接收并解释参数","calendar_handler 接收 argc/argv 和输入输出描述符，识别 list 与 --today；NativeOffloadUtils 提供子命令、选项、日期解析等公共函数。","argv → list 操作和日期范围"],["取得访问条件","cmd_list() 通过 requestCalendarAccess() 请求系统日历授权。当前处理器使用完成回调与信号量等待结果；失败时输出 authorization_denied 等错误。","系统授权结果 → 执行或错误返回"],["查询系统对象","resolve_date_range() 将 --today 转成设备本地当日区间；EKEventStore 创建时间谓词，查询、排序并按条件筛选事件。","日期范围 → EKEvent 列表"],["统一结果并返回","event_to_dict() 转换事件字段，noff_json_envelope() / noff_json_error() 封装结果，noff_emit_json() 写到输出描述符。退出码随处理器返回，上层再交给模型。","事件对象 → JSON + 退出码 → Agent"]],"details":[["三种名称对应三个层次","shell_execute 是模型可选的工具名；apple-calendar 是该工具运行的项目命令；EKEventStore 是处理器调用的苹果 API 类型。沿这三层追踪同一条请求，可以定位输入、执行和系统返回。"],["两道权限各自负责什么","OffloadPermissionManager 管理应用内 bypass / askOnce / notAllowed；EventKit、Photos 等再检查系统授权。bypass 表示通过 MinisX 门禁这一层，系统授权仍独立检查。命令层的 --confirm 还需要单独满足。"],["应用内门禁的实际覆盖","extractOffloadCommand() 按命令字符串的首个 token 匹配已登记清单，只有部分工具出现在可配置权限页。命令识别、并发询问和嵌套调用的完整覆盖需要专门验证；当前说明记录已读实现的范围。"],["Swift 桥接为什么会再多一层","例如 WeatherKit 和 AlarmKit 的接口由 Swift helper 暴露给 Objective-C 处理器。处理器把参数交给 Bridge，Bridge 在 Task 或完成回调中返回 NSDictionary / Error，然后继续统一输出。"]],"refs":[{"path":"src/ios/Agent/Chat/AIChatViewModel+ConcurrentTools.swift","symbol":"shell_execute 权限检查、executeCommand 回调与结果处理","lines":[217,388],"kind":"源码"},{"path":"src/ios/iSH/ISHKernel.m","symbol":"bootWithRootPath: 原生处理器注册","lines":[413,447],"kind":"源码"},{"path":"src/ios/NativeOffloads/CalendarOffload.m","symbol":"calendar_handler(); cmd_list(); event_to_dict(); calendar_offload_register()","lines":null,"kind":"源码"},{"path":"src/ios/NativeOffloads/NativeOffloadUtils.m","symbol":"JSON 封装与输出","lines":[131,215],"kind":"源码"},{"path":"src/ios/Agent/Offload/OffloadPermissionManager.swift","symbol":"extractOffloadCommand(); checkPermission()","lines":null,"kind":"源码"},{"path":"src/ios/NativeOffloads/AlarmOffloadBridge.swift","symbol":"requestAuthorization(); scheduleAlarm()","lines":null,"kind":"源码"}]},"os":{"intro":"这里按照“处理器调用了哪个框架，以及当前暴露了哪些操作”阅读。系统框架是一组苹果提供的 API；具体对象访问范围由系统管理。","steps":[["把意图转换为系统参数","日历处理器把“今天”换成开始/结束时间；照片操作换成资源 ID；健康操作换成样本类型与时间区间。","用户意图 → 处理器参数 → API 输入"],["核对能力、授权和对象范围","同时检查项目是否封装了所需操作、用户给出的授权范围，以及硬件/服务/类型规则。照片可局部授权，健康读写按类型处理，本地通知针对本 App。","访问条件 → 可处理的对象集合"],["等待系统返回","EventKit、Photos 等返回对象或完成回调；Swift Bridge 可用 Task 等待异步 API。天气和地图服务还可能等待联网结果。","API 调用 → 对象 / 完成结果 / Error"],["由处理器把结果交回 Agent","系统对象转为 JSON 或输出文件，沿原生处理器 → 命令结果 → toolResult 返回。模型随后根据上下文决定如何答复或继续调用。","系统结果 → 工具结果 → 模型决策"]],"details":[["三个需要分别确认的问题","系统是否提供所需 API？项目是否把该操作封装成可调用命令？当前设备是否满足授权与运行条件？功能开发前按此顺序查证。"],["数据实际存在哪里","日历、健康与照片原始数据由系统及相应服务管理；命令结果可能成为消息历史或导出文件。App 的 SQLite 保存会话/状态，系统框架通过自己的 API 管理原始对象。"],["本地调用与数据流向","处理器在设备本地运行；天气/路线等可使用网络服务。工具结果还可能进入当前配置的模型请求。完整数据流向与隐私审计保留为独立验证事项。"],["收到系统结果怎样判断成功","按层检查调用方是否执行、exitCode、JSON 中 ok/error，以及系统返回的对象 ID 或可查询状态。对于外设无响应写入、URL 跳转等，需要结合后续状态验证目标动作。"]],"refs":[{"path":"docs/specs/ios-device-data-capabilities.md","symbol":"第 2、3、4、6 节","lines":null,"kind":"项目文档"},{"path":"src/ios/NativeOffloads/CalendarOffload.m","symbol":"requestCalendarAccess(); cmd_list()","lines":null,"kind":"源码"},{"path":"src/ios/NativeOffloads/WeatherOffload.m","symbol":"fetchWeatherForLatitude:longitude:completion:","lines":null,"kind":"源码"},{"path":"src/ios/NativeOffloads/AlarmOffloadBridge.swift","symbol":"AlarmManager; requestAuthorization()","lines":null,"kind":"源码"}]}}}</script>

function serialize(route) {

function allSourceRefs() {
 const refs=[...DATA.nodes.flatMap(n=>n.refs),...DATA.steps.flatMap(s=>s.refs),...DATA.branches.flatMap(b=>b.refs),...DATA.diagnostics.flatMap(d=>d.refs),...CAPS.items.flatMap(c=>c.refs),...CAPS.gaps.flatMap(c=>c.refs),...Object.values(DATA.moduleGuides).flatMap(g=>g.refs),...DATA.frameworks.flatMap(f=>f.refs)];
 const map=new Map();
 for(const r of refs) {if(!map.has(r.path))map.set(r.path,[]);const list=map.get(r.path);if(!list.some(x=>x.symbol===r.symbol&&JSON.stringify(x.lines)===JSON.stringify(r.lines)))list.push(r);}
 return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function sourceIndexHTML() {
 const all=allSourceRefs(), q=sourceQuery.trim().toLowerCase();

}

abel class="search source-filter"><span aria-hidden="true">⌕</span><input id="source-search" type="search" value="${esc(sourceQuery)}" aria-label="搜索源码文件或函数" placeholder="按文件名 / 函数查找"></label></div><div id="source-index-list">${sourceIndexHTML()}</div></section><section class="notice"><strong>文件与验证边界</strong>页面内嵌图文、样式和脚本；打开 GitHub 源码链接需要联网。本版保留原有代码分析基线，应用编译、真实请求、手机数据和云同步属于待运行验证范围。生成文件位于本次会话的交付目录，仓库保持原样。网页自身的验证记录见交付包中的 validation.json。</section>${footer()}`;

function render() {
 if(route.page==='flow')lastFlow={...route};
 document.getElementById('sidebar').innerHTML=navigationHTML();
 const main=document.getElementById('main');
 main.innerHTML=route.page==='architecture'?overviewPage():route.page==='module'?modulePage():route.page==='flow'?(route.branch?branchPage():flowPage()):route.page==='diagnostics'?diagnosticsPage():route.page==='capabilities'?capabilitiesPage():sourcesPage();
 const name=route.page==='module'?NODES[route.id].title:route.page==='flow'?(route.branch?BRANCH_TITLES[route.branch]:`${pad(route.step)} ${STEPS[route.step-1].title}`):{architecture:'整体架构',diagnostics:'问题定位',capabilities:'原生能力清单',sources:'版本与源码'}[route.page];
 document.title=name+' · MinisX 架构导览 v3';
 main.dataset.page=route.page;
 main.dataset.step=route.page==='flow'&&!route.branch?String(route.step):'';
 main.dataset.module=route.page==='module'?route.id:'';
 lastRenderedHash=serialize(route);
 // Scroll only the timeline container; never move the document as a side effect.
 const timeline=main.querySelector('.timeline-scroll'),current=main.querySelector('.timeline-step.current');
 if(timeline&&current&&timeline.scrollWidth>timeline.clientWidth) {
  const relative=current.getBoundingClientRect().left-timeline.getBoundingClientRect().left;
  timeline.scrollLeft=Math.max(0,relative-(timeline.clientWidth-current.clientWidth)/2);
 }
}
function navigationKey(r) {return pathOf(r)+(r.page==='module'&&r.from?'|'+r.from:'');}
function navigate(next, options={}) {
 const old=serialize(route),target=serialize(next);
 if(old===target) return;
 scrollPositions.set(old,window.scrollY);
 const stay=options.keepScroll??(navigationKey(route)===navigationKey(next));
 const oldScroll=window.scrollY;
 if(next.page==='capabilities'&&next.focus)capQuery='';
 route=next;
 try {history.pushState({atlas:true},'',target);} catch(_) {location.hash=target;}
 render();
 window.scrollTo(0,options.restoreSaved?(scrollPositions.get(target)||0):(stay?oldScroll:0));
 if(!stay)document.getElementById('main').focus({preventScroll:true});
 if(next.page==='capabilities'&&next.focus) requestAnimationFrame(()=>document.getElementById('cap-'+next.focus)?.scrollIntoView({block:'start'}));
}
function restoreNavigation() {
 const next=parseRoute(location.hash),canonical=serialize(next);
 if(canonical===lastRenderedHash)return;
 scrollPositions.set(lastRenderedHash,window.scrollY);
 route=next;render();
 requestAnimationFrame(()=>window.scrollTo(0,scrollPositions.get(canonical)||0));
}
function updateGraphSearch() {
 const scope=scopeOf(route);if(!scope)return;
 const query=queryByPage[pathOf(route)]||'';
 document.getElementById('graph-container').innerHTML=graphSVG(scope,route.selected,query);
 const results=document.getElementById('map-results');
 results.hidden=!query.trim();results.innerHTML=searchResults(scope,query);
}
let toastTimer;
function toast(text) {
 clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.hidden=false;
 toastTimer=setTimeout(()=>{el.hidden=true;},2300);
}
document.addEventListener('click',e=>{
 const nav=e.target.closest('a[data-nav]');
 if(nav) {
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;
  e.preventDefault();navigate(parseRoute(nav.getAttribute('href')),{restoreSaved:nav.hasAttribute('data-return')});return;
 }
 const clearCaps=e.target.closest('[data-clear-caps]');
 if(clearCaps){capQuery='';const input=document.getElementById('capability-search');if(input)input.value='';document.getElementById('capability-results').innerHTML=capResults();input?.focus();return;}
 const select=e.target.closest('[data-select-node]');
 if(select) {
  const scope=scopeOf(route),id=select.dataset.selectNode;
  if(scope&&SCOPES[scope].nodes.some(n=>n[0]===id)) {
   navigate({...route,selected:id},{keepScroll:true});
   if(e.detail===0)document.querySelector(`#graph-container [data-select-node="${id}"]`)?.focus({preventScroll:true});
  }
  return;
 }
 const scroll=e.target.closest('[data-scroll]');
 if(scroll) {e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({block:'start'});return;}
 if(e.target.closest('[data-clear-search]')) {
  queryByPage[pathOf(route)]='';const input=document.getElementById('map-search');if(input){input.value='';updateGraphSearch();input.focus();}
 }
});
document.addEventListener('keydown',e=>{
 const node=e.target.closest('svg [data-select-node]');
 if(node&&(e.key==='Enter'||e.key===' ')) {e.preventDefault();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('input',e=>{
 if(e.target.id==='map-search') {queryByPage[pathOf(route)]=e.target.value;updateGraphSearch();}
 if(e.target.id==='capability-search'){capQuery=e.target.value;const results=document.getElementById('capability-results');if(results)results.innerHTML=capResults();}
 if(e.target.id==='source-search') {sourceQuery=e.target.value;document.getElementById('source-index-list').innerHTML=sourceIndexHTML();}
});
window.addEventListener('popstate',restoreNavigation);
window.addEventListener('hashchange',restoreNavigation);
try {history.scrollRestoration='manual';history.replaceState({atlas:true},'',serialize(route));} catch(_) { /* Restricted preview environments keep in-memory navigation. */ }
render();
})();
